name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM (libclang for bindgen)
        run: choco install llvm -y --no-progress

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Cache vcpkg-installed native deps
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install native deps (OpenColorIO, lcms, OpenEXR)
        run: >
          & "$env:VCPKG_ROOT\vcpkg.exe" install opencolorio lcms openexr
          --triplet x64-windows --clean-after-build

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (gamma-only fallback)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: build (release)
        run: cargo build --release
