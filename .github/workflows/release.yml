name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM (libclang for bindgen)
        run: choco install llvm -y --no-progress

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Cache vcpkg-installed native deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install native deps (OpenColorIO, lcms, OpenEXR)
        # Manifest mode: vcpkg.json in the repo root drives the install, so no
        # package args are passed. Output lands in ./vcpkg_installed, which
        # build.rs discovers ahead of the classic %VCPKG_ROOT%\installed path.
        run: >
          & "$env:VCPKG_ROOT\vcpkg.exe" install
          --triplet x64-windows --clean-after-build

      - name: Verify Cargo version matches the tag
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($cargo -ne $tag) { throw "Cargo.toml version $cargo does not match tag $tag" }
          Write-Output "Version $cargo matches tag."

      - name: rustfmt / clippy / test
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Package distribution zip
        run: pwsh scripts\package.ps1 -Profile release -OutDir dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Self-contained Windows x64 build of imgvwr.

            Extract the zip and run `imgvwr.exe` — no prerequisites required.
            Because the binary is unsigned, Windows SmartScreen may prompt on
            first launch (More info → Run anyway).
          fail_on_unmatched_files: true
